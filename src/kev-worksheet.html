<script>
(function () {
  var STORAGE_KEY = "kfjr_kev_worksheet_v1";
  var data = JSON.parse(document.getElementById("worksheet-data").textContent);
  var questions = [];
  data.sections.forEach(function (section) {
    section.questions.forEach(function (q) {
      q.section = section.title;
      questions.push(q);
    });
  });
  var codes = questions.map(function (q) { return q.code; });
  var expected = [];
  for (var n = 1; n <= 17; n += 1) expected.push("K" + n);
  var fatalText = "";
  if (data.sections.length !== 6 || questions.length !== 17 || codes.join(",") !== expected.join(",")) {
    fatalText = "This worksheet is missing questions. Expected K1 through K17 in 6 sections.";
  }
  questions.forEach(function (q) {
    if (!q.title || !q.hint || !q.parts || !q.parts.length) fatalText = "This worksheet is missing the text for " + q.code + ".";
  });
  if (fatalText) {
    var fatal = document.getElementById("fatal");
    fatal.hidden = false;
    fatal.textContent = fatalText;
    return;
  }

  var state = loadState();

  function loadState() {
    var empty = { answers: {} };
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return empty;
      var parsed = JSON.parse(raw);
      var answers = {};
      if (parsed.answers) {
        expected.forEach(function (code) {
          if (typeof parsed.answers[code] === "string") answers[code] = parsed.answers[code];
        });
      }
      return { answers: answers };
    } catch (err) {
      return empty;
    }
  }

  function el(tag, attrs, text) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        if (key === "class") node.className = attrs[key];
        else node.setAttribute(key, attrs[key]);
      });
    }
    if (text != null) node.textContent = text;
    return node;
  }

  function slug(title) {
    return "section-" + title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }

  function render() {
    var jump = document.getElementById("jump");
    var root = document.getElementById("root");
    data.sections.forEach(function (section) {
      var id = slug(section.title);
      jump.appendChild(el("a", { href: "#" + id }, section.title));
      var wrap = el("section", { class: "group", id: id });
      var head = el("div", { class: "group-head" });
      head.appendChild(el("h2", null, section.title));
      wrap.appendChild(head);
      section.questions.forEach(function (q) {
        var field = el("div", { class: "q-field", id: "q-" + q.code, "data-code": q.code });
        var label = el("label", { for: "answer-" + q.code });
        label.appendChild(el("span", { class: "kcode" }, q.code + "."));
        label.appendChild(document.createTextNode(" " + q.title));
        var prompt = el("div", { class: "prompt", id: "prompt-" + q.code });
        q.parts.forEach(function (part) {
          if (part.type === "ul") {
            var list = el("ul");
            part.items.forEach(function (item) { list.appendChild(el("li", null, item)); });
            prompt.appendChild(list);
          } else {
            prompt.appendChild(el("p", null, part.text));
          }
        });
        var hint = el("p", { class: "hint", id: "hint-" + q.code }, "Hint: " + q.hint);
        var box = el("textarea", {
          id: "answer-" + q.code,
          "data-answer-for": q.code,
          rows: "3",
          placeholder: "Type your answer",
          "aria-describedby": "prompt-" + q.code + " hint-" + q.code
        });
        box.value = state.answers[q.code] || "";
        field.appendChild(label);
        field.appendChild(prompt);
        field.appendChild(hint);
        field.appendChild(box);
        wrap.appendChild(field);
      });
      root.appendChild(wrap);
    });
  }

  function autosize(node) {
    node.style.height = "auto";
    node.style.height = Math.max(96, node.scrollHeight) + "px";
  }

  function answeredCount() {
    return questions.filter(function (q) {
      return (state.answers[q.code] || "").trim().length > 0;
    }).length;
  }

  function updateProgress() {
    var count = answeredCount();
    var progress = document.getElementById("progress");
    progress.textContent = "";
    progress.appendChild(el("strong", null, String(count)));
    progress.appendChild(document.createTextNode(" of 17 answered"));
    document.getElementById("meter-bar").style.width = (count / 17 * 100) + "%";
  }

  var savedTimer = 0;
  function persist(showSaved) {
    var answers = {};
    questions.forEach(function (q) {
      var value = state.answers[q.code];
      if (value && value.trim()) answers[q.code] = value;
    });
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: answers,
        updatedAt: new Date().toISOString()
      }));
      if (showSaved) {
        var saved = document.getElementById("saved");
        saved.textContent = "Saved";
        saved.classList.add("show");
        clearTimeout(savedTimer);
        savedTimer = setTimeout(function () { saved.classList.remove("show"); }, 1200);
      }
    } catch (err) {
      var savedFail = document.getElementById("saved");
      savedFail.textContent = "Not saved";
      savedFail.classList.add("show");
    }
  }

  function promptText(q) {
    return q.parts.map(function (part) {
      if (part.type === "ul") return part.items.map(function (item) { return "- " + item; }).join("\n");
      return part.text;
    }).join("\n\n");
  }

  function buildPlain() {
    return questions.map(function (q) {
      var answer = (state.answers[q.code] || "").trim();
      return q.code + " \u2014 " + q.title + ": " + (answer || "(skipped)");
    }).join("\n\n") + "\n";
  }

  function buildJson() {
    var answered = answeredCount();
    return {
      exportedAt: new Date().toISOString(),
      page: "/kev-worksheet/",
      storageKey: STORAGE_KEY,
      summary: {
        total: 17,
        answered: answered,
        skipped: 17 - answered
      },
      answers: questions.map(function (q) {
        var answer = (state.answers[q.code] || "").trim();
        return {
          code: q.code,
          section: q.section,
          question: q.title,
          prompt: promptText(q),
          hint: q.hint,
          mapsTo: q.mapsTo || "",
          answer: answer,
          skipped: !answer
        };
      })
    };
  }

  var toastTimer = 0;
  function showToast(message) {
    var toast = document.getElementById("toast");
    toast.hidden = false;
    toast.textContent = message;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 5000);
  }

  function flashButton(button, text) {
    if (!button.getAttribute("data-label")) button.setAttribute("data-label", button.textContent);
    button.textContent = text;
    clearTimeout(button._timer);
    button._timer = setTimeout(function () {
      button.textContent = button.getAttribute("data-label");
    }, 5000);
  }

  function fallbackCopy(text) {
    var box = document.getElementById("copy-fallback");
    box.hidden = false;
    box.value = text;
    box.focus();
    box.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    if (ok) box.hidden = true;
    return ok;
  }

  function copyAnswers() {
    var text = buildPlain();
    var button = document.getElementById("copy-btn");
    var finished = false;
    function finish(ok) {
      if (ok) {
        finished = true;
        flashButton(button, "Copied!");
        showToast("Copied!");
        document.getElementById("copy-fallback").hidden = true;
        return;
      }
      if (finished) return;
      finished = true;
      var copied = fallbackCopy(text);
      if (copied) {
        flashButton(button, "Copied!");
        showToast("Copied!");
      } else {
        flashButton(button, "Copy failed");
        showToast("Copy the selected text");
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      var timer = setTimeout(function () { finish(false); }, 800);
      navigator.clipboard.writeText(text).then(function () {
        clearTimeout(timer);
        finish(true);
      }).catch(function () {
        clearTimeout(timer);
        finish(false);
      });
    } else {
      finish(false);
    }
  }

  function downloadJson() {
    var blob = new Blob([JSON.stringify(buildJson(), null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "kfjr-kev-worksheet.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    flashButton(document.getElementById("download-btn"), "Downloaded");
    showToast("Downloaded");
  }

  function sizeHeader() {
    var header = document.querySelector(".topbar");
    var bar = document.querySelector(".actionbar");
    document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
    document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
  }

  document.getElementById("copy-btn").addEventListener("click", copyAnswers);
  document.getElementById("download-btn").addEventListener("click", downloadJson);
  document.body.addEventListener("input", function (event) {
    var node = event.target;
    if (!node.hasAttribute("data-answer-for")) return;
    var code = node.getAttribute("data-answer-for");
    if (node.value && node.value.trim()) state.answers[code] = node.value;
    else delete state.answers[code];
    autosize(node);
    persist(true);
    updateProgress();
  });
  window.addEventListener("resize", sizeHeader);

  render();
  document.querySelectorAll("textarea").forEach(function (node) {
    if (node.id !== "copy-fallback") autosize(node);
  });
  updateProgress();
  sizeHeader();
  var hadSaved = false;
  try { hadSaved = !!localStorage.getItem(STORAGE_KEY); } catch (err) { hadSaved = false; }
  if (hadSaved) {
    var saved = document.getElementById("saved");
    saved.textContent = "Saved";
    saved.classList.add("show");
    savedTimer = setTimeout(function () { saved.classList.remove("show"); }, 1200);
  }
})();
</script>
</body>
</html>
{% endraw %}
